#
# Builds a RedisInstance as an Amazon ElastiCache for Valkey replication group.
# Valkey speaks the Redis protocol, so Redis clients connect unchanged.
#
# For each RedisInstance, in the RedisInstance's own namespace:
#   ReplicationGroup   the cache, in the VPC's private subnets, with TLS-only
#                      connections and an auth token. Cluster mode is off, so
#                      clients connect to a single primary endpoint. The
#                      provider generates the auth token into the Secret
#                      "<name>-conn", under "password", the name and key the
#                      ResourceType reads
#
# Per-data-plane settings come from the `aws` EnvironmentConfig: the region,
# name prefix, security groups and tags shared by every AWS Composition, and
# the Redis settings under `redis`. The subnet group (by name) and the security
# groups (by ID) are only referenced, never created or deleted here.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: redis-aws
  labels:
    app.kubernetes.io/name: provisioner-crossplane
    app.kubernetes.io/part-of: openchoreo
spec:
  compositeTypeRef:
    apiVersion: crossplane.community.openchoreo.dev/v1alpha1
    kind: RedisInstance
  mode: Pipeline
  pipeline:
    # 1. Load this data plane's settings into the pipeline context.
    - step: load-settings
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: aws

    # 2. Render the cache, and copy what clients need into the RedisInstance's
    #    status.
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $settings := index .context "apiextensions.crossplane.io/environment" }}
            {{- $redis := $settings.redis }}

            {{- /* Replication group IDs are unique per account and region:
                   1-40 letters, digits and hyphens, starting with a letter,
                   with no two hyphens in a row and no hyphen at the end. The
                   RedisInstance name only covers the Resource and the
                   environment, so add a hash of its namespace, which differs
                   per OpenChoreo namespace and project. If the result is too
                   long, or had characters to replace or hyphens to collapse,
                   keep it unique with a hash of the full name. A cache that
                   already exists keeps its ID. */}}
            {{- $fullName := printf "%s%s-%s" $settings.namePrefix $xr.metadata.name ($xr.metadata.namespace | sha256sum | trunc 8) }}
            {{- $groupId := regexReplaceAll "-+" (regexReplaceAll "[^a-z0-9-]" (lower $fullName) "-") "-" }}
            {{- if or (ne $groupId $fullName) (gt (len $groupId) 40) }}
            {{- $groupId = printf "%s-%s" ($groupId | trunc 31 | trimSuffix "-") ($fullName | sha256sum | trunc 8) }}
            {{- end }}
            {{- with getComposedResource . "cache" }}
            {{- with dig "metadata" "annotations" "crossplane.io/external-name" "" . }}
            {{- $groupId = . }}
            {{- end }}
            {{- end }}

            {{- $nodeType := index (dict "small" "cache.t4g.micro" "medium" "cache.t4g.small" "large" "cache.t4g.medium") $xr.spec.size }}
            {{- /* A replica in a second zone, with automatic failover,
                   doubles the cost; leave it off for small. */}}
            {{- $highAvailability := ne $xr.spec.size "small" }}

            {{- $address := "" }}
            {{- with getComposedResource . "cache" }}
            {{- $address = dig "status" "atProvider" "primaryEndpointAddress" "" . }}
            {{- end }}
            ---
            apiVersion: elasticache.aws.m.upbound.io/v1beta1
            kind: ReplicationGroup
            metadata:
              name: {{ $xr.metadata.name }}
              annotations:
                {{ setResourceNameAnnotation "cache" }}
                crossplane.io/external-name: {{ $groupId | quote }}
            spec:
              forProvider:
                region: {{ $settings.region | quote }}
                description: {{ printf "Valkey for %s/%s" $xr.metadata.namespace $xr.metadata.name | quote }}
                engine: valkey
                nodeType: {{ $nodeType }}
                numCacheClusters: {{ if $highAvailability }}2{{ else }}1{{ end }}
                automaticFailoverEnabled: {{ $highAvailability }}
                multiAzEnabled: {{ $highAvailability }}
                port: 6379
                transitEncryptionEnabled: true
                atRestEncryptionEnabled: "true"
                autoGenerateAuthToken: true
                authTokenSecretRef:
                  name: {{ $xr.metadata.name }}-conn
                  key: password
                subnetGroupName: {{ $redis.subnetGroupName | quote }}
                securityGroupIds: {{ $settings.securityGroupIds | toJson }}
                applyImmediately: true
                {{- with $settings.tags }}
                tags:
                  {{- range $key, $value := . }}
                  {{ $key | quote }}: {{ $value | toString | quote }}
                  {{- end }}
                {{- end }}
            {{- if $address }}
            ---
            {{- /* No resource-name annotation: this updates the
                   RedisInstance's own status instead of composing one. */}}
            apiVersion: crossplane.community.openchoreo.dev/v1alpha1
            kind: RedisInstance
            status:
              address: {{ $address | quote }}
              port: 6379
            {{- end }}

    # 3. Mark the cache Ready when AWS reports it available, and the
    #    RedisInstance Ready with it.
    - step: ready
      functionRef:
        name: function-auto-ready
